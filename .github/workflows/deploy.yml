name: Deploy to GitHub Pages

# Builds the app and publishes dist/ to the gh-pages branch. GitHub
# auto-enables Pages from that branch on first deploy, so no manual
# repo-settings step is needed. Live at:
# https://andiescott-hub.github.io/pokemonmaker/

on:
  push:
    branches: [main, claude/setup-for-building-twtvay]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          # Point the app at your generation worker. Unset = the app falls
          # back to its offline preview generator, so builds never break.
          # VITE_GENERATOR_URL is a repository VARIABLE (the worker URL).
          # The access code is read from the same ACCESS_CODE secret the
          # worker uses, so it is only ever set in one place. Note it ends
          # up in the public JS bundle — see worker/README.md.
          VITE_GENERATOR_URL: ${{ vars.VITE_GENERATOR_URL }}
          VITE_ACCESS_CODE: ${{ secrets.ACCESS_CODE }}
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
