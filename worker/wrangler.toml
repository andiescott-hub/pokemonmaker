name = "creature-maker"
main = "src/index.ts"
compatibility_date = "2025-08-01"
compatibility_flags = ["nodejs_compat"]

# The site allowed to call this worker. Change if the app moves.
[vars]
ALLOWED_ORIGIN = "https://andiescott-hub.github.io"

# Secrets are NOT set here — they never belong in the repo. Set them once with:
#   npx wrangler secret put ANTHROPIC_API_KEY
#   npx wrangler secret put GEMINI_API_KEY
#   npx wrangler secret put ACCESS_CODE
